# GitHub Actions workflow for deploying MkDocs documentation to GitHub Pages
# This workflow builds and deploys the documentation site automatically on push to main branch

name: Deploy MkDocs Documentation

# Trigger the workflow on push to main branch
# You can also add manual trigger or other branches as needed
on:
  push:
    branches:
      - main
  # Allow manual trigger from Actions tab
  workflow_dispatch:

# Set permissions for GitHub Pages deployment
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Build job
  build:
    runs-on: ubuntu-latest
    
    steps:
      # Step 1: Checkout the repository
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Fetch all history for git revision date plugin
      
      # Step 2: Set up Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'  # Use Python 3.11 (latest stable)
          cache: 'pip'  # Cache pip dependencies for faster builds
      
      # Step 3: Install dependencies
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      # Step 4: Configure Git for revision date plugin (optional)
      - name: Configure Git
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
      
      # Step 5: Build the documentation site
      - name: Build MkDocs site
        run: |
          mkdocs build --strict --verbose
      
      # Step 6: Upload the built site as an artifact
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./site  # MkDocs builds to 'site' directory by default

  # Deploy job
  deploy:
    # Only run deploy after successful build
    needs: build
    
    # Deploy to the github-pages environment
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    
    runs-on: ubuntu-latest
    
    steps:
      # Step 1: Deploy to GitHub Pages
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      
      # Step 2: Output deployment URL
      - name: Display deployment URL
        run: |
          echo "📚 Documentation deployed successfully!"
          echo "🔗 URL: ${{ steps.deployment.outputs.page_url }}"
